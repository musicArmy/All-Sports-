<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Sports - Live Stream Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
            margin-bottom: 30px;
        }

        .player-section {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
        }

        .video-container iframe,
        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .player-info {
            background: #1a1a1a;
            padding: 20px;
            color: white;
        }

        .match-title {
            font-size: 1.5rem;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .match-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
            font-size: 0.9rem;
        }

        .detail-item {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 6px;
        }

        .detail-label {
            color: #00bcd4;
            font-weight: 600;
        }

        .quality-selector {
            margin: 20px 0;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 8px;
        }

        .quality-label {
            color: #00bcd4;
            font-weight: 600;
            display: block;
            margin-bottom: 10px;
        }

        .quality-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .quality-btn {
            padding: 8px 16px;
            background: #333;
            color: white;
            border: 2px solid #333;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .quality-btn:hover {
            border-color: #00bcd4;
            background: #2a2a2a;
        }

        .quality-btn.active {
            background: #00bcd4;
            color: #000;
            border-color: #00bcd4;
        }

        .server-selector {
            margin: 20px 0;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 8px;
        }

        .server-label {
            color: #00bcd4;
            font-weight: 600;
            display: block;
            margin-bottom: 10px;
        }

        .server-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
        }

        .server-item {
            padding: 10px;
            background: #333;
            border: 2px solid #333;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.85rem;
            word-break: break-all;
            color: #00bcd4;
        }

        .server-item:hover {
            border-color: #00bcd4;
            background: #2a2a2a;
        }

        .server-item.active {
            background: #00bcd4;
            color: #000;
            border-color: #00bcd4;
        }

        .sidebar {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            color: white;
            max-height: 600px;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .sidebar h2 {
            color: #00bcd4;
            margin-bottom: 15px;
            font-size: 1.2rem;
            border-bottom: 2px solid #00bcd4;
            padding-bottom: 10px;
        }

        .match-item {
            padding: 12px;
            background: #2a2a2a;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .match-item:hover {
            border-color: #00bcd4;
            background: #333;
        }

        .match-item.active {
            border-color: #00bcd4;
            background: #00bcd4;
            color: #000;
        }

        .match-item-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 5px;
        }

        .match-item-status {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .live-badge {
            display: inline-block;
            background: #ff4444;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .upcoming-badge {
            display: inline-block;
            background: #ffaa00;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .viewers {
            font-size: 0.8rem;
            color: #888;
            margin-top: 5px;
        }

        .error-message {
            background: #ff4444;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .loading {
            text-align: center;
            color: white;
            padding: 40px;
            font-size: 1.2rem;
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-top: 4px solid #00bcd4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .play-btn {
            width: 100%;
            padding: 12px;
            background: #00bcd4;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .play-btn:hover {
            background: #00a8cc;
        }

        .play-btn:disabled {
            background: #666;
            cursor: not-allowed;
            color: #999;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab-btn {
            padding: 8px 16px;
            background: #333;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .tab-btn.active {
            background: #00bcd4;
            color: #000;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        @media (max-width: 1024px) {
            .content {
                grid-template-columns: 1fr;
            }

            .sidebar {
                max-height: 400px;
            }

            .header h1 {
                font-size: 2rem;
            }
        }

        .scroll-style::-webkit-scrollbar {
            width: 8px;
        }

        .scroll-style::-webkit-scrollbar-track {
            background: #2a2a2a;
            border-radius: 10px;
        }

        .scroll-style::-webkit-scrollbar-thumb {
            background: #00bcd4;
            border-radius: 10px;
        }

        .scroll-style::-webkit-scrollbar-thumb:hover {
            background: #00a8cc;
        }

        .server-list, .sidebar {
            scrollbar-color: #00bcd4 #2a2a2a;
            scrollbar-width: thin;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-play-circle"></i> All Sports Live Player</h1>
            <p>Watch Live Matches with Quality Selection</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="content">
            <div class="player-section">
                <div class="video-container">
                    <video id="videoPlayer" controls style="background: #000;"></video>
                </div>

                <div class="player-info">
                    <div class="match-title" id="matchTitle">Select a match to play</div>
                    <div class="match-details" id="matchDetails"></div>

                    <div class="quality-selector">
                        <label class="quality-label">
                            <i class="fas fa-cog"></i> Video Quality
                        </label>
                        <div class="quality-buttons" id="qualityButtons"></div>
                    </div>

                    <div class="server-selector">
                        <label class="server-label">
                            <i class="fas fa-server"></i> Select Server
                        </label>
                        <div class="server-list scroll-style" id="serverList"></div>
                        <button class="play-btn" id="playBtn" onclick="playStream()" disabled>
                            <i class="fas fa-play"></i> Play Stream
                        </button>
                    </div>
                </div>
            </div>

            <div class="sidebar scroll-style">
                <h2><i class="fas fa-list"></i> Matches</h2>
                <div class="tabs">
                    <button class="tab-btn active" onclick="filterMatches('all')">All</button>
                    <button class="tab-btn" onclick="filterMatches('live')">Live</button>
                    <button class="tab-btn" onclick="filterMatches('upcoming')">Upcoming</button>
                </div>
                <div id="matchList" class="scroll-style"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        let allMatches = [];
        let currentMatch = null;
        let currentServerIndex = 0;
        let currentQuality = null;
        let filterType = 'all';

        async function loadMatches() {
            try {
                const response = await fetch('data/matches.json');
                const data = await response.json();
                allMatches = data.matches;
                displayMatches();
                if (allMatches.length > 0) {
                    selectMatch(allMatches[0]);
                }
            } catch (error) {
                showError('Failed to load matches: ' + error.message);
                console.error('Error loading matches:', error);
            }
        }

        function displayMatches() {
            const matchList = document.getElementById('matchList');
            const filteredMatches = filterType === 'all' ? allMatches : allMatches.filter(m => m.status === filterType);

            matchList.innerHTML = filteredMatches.map((match) => `
                <div class="match-item ${currentMatch?.match_id === match.match_id ? 'active' : ''}" 
                     onclick="selectMatch(allMatches.find(m => m.match_id === '${match.match_id}'))">
                    <div class="match-item-title">${match.title}</div>
                    <div class="match-item-status">
                        ${match.status === 'live' ? `<span class="live-badge"><i class="fas fa-circle"></i> LIVE</span>` : `<span class="upcoming-badge">UPCOMING</span>`}
                        ${match.league}
                    </div>
                    <div class="viewers">
                        <i class="fas fa-users"></i> ${match.viewers} ${match.viewers_type}
                    </div>
                </div>
            `).join('');
        }

        function selectMatch(match) {
            currentMatch = match;
            currentServerIndex = 0;
            currentQuality = null;

            document.getElementById('matchTitle').textContent = match.title;

            const details = `
                <div class="detail-item">
                    <div class="detail-label">Sport</div>
                    <div>${match.sport || 'N/A'}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Status</div>
                    <div>${match.status === 'live' ? '<span class="live-badge">LIVE</span>' : 'UPCOMING'}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">League</div>
                    <div>${match.league || 'N/A'}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Viewers</div>
                    <div>${match.viewers || '0'} ${match.viewers_type || ''}</div>
                </div>
            `;
            document.getElementById('matchDetails').innerHTML = details;

            setupQualityButtons();
            setupServers();
            displayMatches();
        }

        function setupQualityButtons() {
            const qualities = ['Auto', '1080p', '720p', '480p', '360p'];
            const qualityButtons = document.getElementById('qualityButtons');
            qualityButtons.innerHTML = qualities.map((q, i) => `
                <button class="quality-btn ${i === 0 ? 'active' : ''}" onclick="selectQuality('${q}', event)">${q}</button>
            `).join('');
        }

        function selectQuality(quality, event) {
            currentQuality = quality;
            document.querySelectorAll('.quality-btn').forEach(btn => btn.classList.remove('active'));
            if (event && event.target) {
                event.target.classList.add('active');
            }
        }

        function setupServers() {
            const serverList = document.getElementById('serverList');
            const servers = currentMatch.server_urls || [];

            if (servers.length === 0) {
                serverList.innerHTML = '<div style="color: #888; padding: 20px; text-align: center;">No servers available yet</div>';
                document.getElementById('playBtn').disabled = true;
                return;
            }

            serverList.innerHTML = servers.map((url, index) => `
                <div class="server-item ${index === 0 ? 'active' : ''}" onclick="selectServer(${index})">
                    <i class="fas fa-server"></i> Server ${index + 1}
                    <div style="font-size: 0.75rem; margin-top: 5px; opacity: 0.7;">
                        ${url.substring(0, 60)}...
                    </div>
                </div>
            `).join('');

            document.getElementById('playBtn').disabled = false;
        }

        function selectServer(index) {
            currentServerIndex = index;
            document.querySelectorAll('.server-item').forEach((item, i) => {
                item.classList.toggle('active', i === index);
            });
        }

        function playStream() {
            if (!currentMatch || !currentMatch.server_urls || currentMatch.server_urls.length === 0) {
                showError('No stream available');
                return;
            }

            const url = currentMatch.server_urls[currentServerIndex];
            const videoPlayer = document.getElementById('videoPlayer');

            if (url.includes('.m3u8') || url.includes('.ts')) {
                loadHLSStream(videoPlayer, url);
            } else {
                videoPlayer.src = url;
                videoPlayer.play().catch(err => {
                    showError('Failed to play stream: ' + err.message);
                });
            }
        }

        function loadHLSStream(videoPlayer, url) {
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(videoPlayer);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    videoPlayer.play().catch(err => {
                        showError('Failed to play stream: ' + err.message);
                    });
                });
            } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                videoPlayer.src = url;
                videoPlayer.play().catch(err => {
                    showError('Failed to play stream: ' + err.message);
                });
            } else {
                showError('Your browser does not support HLS streams. Try a different browser.');
            }
        }

        function filterMatches(type) {
            filterType = type;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = Array.from(document.querySelectorAll('.tab-btn')).find(btn => btn.textContent.toLowerCase() === type);
            if (activeBtn) activeBtn.classList.add('active');
            displayMatches();
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = '❌ ' + message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        window.addEventListener('load', loadMatches);
    </script>
</body>
</html>
